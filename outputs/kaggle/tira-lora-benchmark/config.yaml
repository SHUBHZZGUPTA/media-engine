job: extension
config:
  name: tira_zimage_lora
  process:
  - type: sd_trainer
    training_folder: /tmp/train/output
    device: cuda:0
    network:
      type: lora
      linear: 16
      linear_alpha: 16
    save:
      dtype: float16
      save_every: 30
      max_step_saves_to_keep: 20
    datasets:
    - folder_path: /tmp/train/dataset
      caption_ext: txt
      caption_dropout_rate: 0.05
      cache_latents_to_disk: true
      resolution:
      - 512
      - 768
    train:
      batch_size: 1
      steps: 30
      gradient_accumulation_steps: 1
      train_unet: true
      train_text_encoder: false
      gradient_checkpointing: true
      noise_scheduler: flowmatch
      timestep_type: weighted
      optimizer: adamw8bit
      lr: 0.0001
      dtype: bf16
      unload_text_encoder: false
      skip_first_sample: true
      ema_config:
        use_ema: false
    model:
      name_or_path: Tongyi-MAI/Z-Image-Turbo
      arch: zimage
      quantize: true
      qtype: qfloat8
      quantize_te: true
      low_vram: true
      assistant_lora_path: ostris/zimage_turbo_training_adapter/zimage_turbo_training_adapter_v2.safetensors
    sample:
      sampler: flowmatch
      sample_every: 300
      width: 768
      height: 1024
      prompts: []
      seed: 42
      walk_seed: true
      guidance_scale: 1
      sample_steps: 9
meta:
  name: tira_zimage_lora
  version: '1.0'
