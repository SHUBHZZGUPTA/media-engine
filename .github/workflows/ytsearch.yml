name: ytsearch
# Read-only YouTube search (Data API, non-personalised, explicit region/language). Runs when a job file is pushed to jobs/ytsearch/.
on:
  push:
    branches: [main]
    paths: ['jobs/ytsearch/*.json']
permissions:
  contents: write
concurrency:
  group: ytsearch
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Search
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_RT_MM_EN: ${{ secrets.YT_RT_MM_EN }}
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'jobs/ytsearch/*.json' || true)
          for f in $CHANGED; do [ -f "$f" ] && python3 tools/yt_search.py "$f"; done
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "media-engine-bot"
          git config user.email "media-engine-bot@users.noreply.github.com"
          git add outputs || true
          git diff --cached --quiet && exit 0
          git commit -m "ytsearch outputs [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
