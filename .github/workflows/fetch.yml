name: fetch
# Runs when a job file is pushed to jobs/fetch/. Downloads public files listed in the job.
on:
  push:
    branches: [main]
    paths: ['jobs/fetch/*.json']
permissions:
  contents: write
concurrency:
  group: fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'jobs/fetch/*.json' || true)
          for f in $CHANGED; do [ -f "$f" ] || continue; id=$(basename "$f" .json); mkdir -p outputs/fetch/$id; python3 tools/fetch_files.py "$f" > outputs/fetch/$id/log.txt 2>&1 || echo "FAILED $?" >> outputs/fetch/$id/log.txt; done
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "media-engine-bot"
          git config user.email "media-engine-bot@users.noreply.github.com"
          git add outputs || true
          git diff --cached --quiet && exit 0
          git commit -m "fetch outputs [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
