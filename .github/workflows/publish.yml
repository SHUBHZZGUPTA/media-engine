name: publish
# A Short is queued by pushing an orphan branch queue/<id> holding publish.json + the MP4.
# This uploads it to YouTube, records the result on main (outputs/publish/<id>.json), then deletes the branch.
on:
  push:
    branches: ['queue/**']
permissions:
  contents: write
concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: q
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q google-api-python-client google-auth
      - name: Upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_RT_MM_EN: ${{ secrets.YT_RT_MM_EN }}
          YT_RT_MM_HI: ${{ secrets.YT_RT_MM_HI }}
          YT_RT_BHUGOL_EN: ${{ secrets.YT_RT_BHUGOL_EN }}
          YT_RT_BHUGOL_HI: ${{ secrets.YT_RT_BHUGOL_HI }}
        run: |
          ID=$(python3 -c "import json;print(json.load(open('q/publish.json'))['id'])")
          mkdir -p main/outputs/publish
          python3 main/tools/yt_publish.py q main/outputs/publish/$ID.json
      - name: Record result on main
        if: always()
        run: |
          cd main
          git config user.name "media-engine-bot"
          git config user.email "media-engine-bot@users.noreply.github.com"
          git add outputs/publish || true
          git diff --cached --quiet || git commit -m "publish outputs [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
      - name: Delete queue branch
        if: success()
        run: cd q && git push origin --delete "${{ github.ref_name }}"
