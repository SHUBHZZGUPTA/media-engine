name: tts
# Runs when a TTS job file is pushed to jobs/tts/. Uses the GEMINI_API_KEY secret (never printed)
# and commits the finished audio to outputs/tts/<job-id>/.
on:
  push:
    branches: [main]
    paths: ['jobs/tts/*.json']
permissions:
  contents: write
concurrency:
  group: tts
  cancel-in-progress: false
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthesize new jobs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_LONGFORM: ${{ secrets.GEMINI_API_KEY_LONGFORM }}
        run: |
          set -e
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'jobs/tts/*.json' || true)
          [ -z "$CHANGED" ] && CHANGED=$(ls jobs/tts/*.json)
          # Catch-up: a run cancelled by a newer push never processes its job. Also pick up any job file changed in the
          # last 2 days whose current version hasn't been run yet (outputs/tts/<id>/.ran holds the job commit last run), so no pushed job is lost.
          for f in $(git log --since="2 days ago" --name-only --format= -- 'jobs/tts/*.json' | sort -u); do
            [ -f "$f" ] || continue
            case " $CHANGED " in *" $f "*) continue;; esac
            id=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('id') or sys.argv[1].split('/')[-1][:-5])" "$f")
            want=$(git log -1 --format=%H -- "$f"); done_=$(cat "outputs/tts/$id/.ran" 2>/dev/null || true)
            if [ "$want" != "$done_" ]; then echo "catch-up: $f (version $want not run yet)"; CHANGED="$CHANGED $f"; fi
          done
          for f in $CHANGED; do
            [ -f "$f" ] || continue
            python3 tools/gemini_tts.py "$f"
            # mark this version of the job as run (success or not), so catch-up never repeats it
            id=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('id') or sys.argv[1].split('/')[-1][:-5])" "$f")
            mkdir -p "outputs/tts/$id"; git log -1 --format=%H -- "$f" > "outputs/tts/$id/.ran"
          done
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "media-engine-bot"
          git config user.email "media-engine-bot@users.noreply.github.com"
          git add outputs || true
          git diff --cached --quiet && exit 0
          git commit -m "tts outputs [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
