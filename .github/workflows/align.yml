name: align
# Runs when a job file is pushed to jobs/align/. Transcribes an audio file with word timestamps.
on:
  push:
    branches: [main]
    paths: ['jobs/align/*.json']
permissions:
  contents: write
concurrency:
  group: align
  cancel-in-progress: false
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q faster-whisper 2>&1 | tail -5
      - name: Transcribe
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'jobs/align/*.json' || true)
          for f in $CHANGED; do [ -f "$f" ] || continue; id=$(basename "$f" .json); mkdir -p outputs/align/$id; python3 tools/whisper_words.py "$f" > outputs/align/$id/log.txt 2>&1 || echo "FAILED $?" >> outputs/align/$id/log.txt; done
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "media-engine-bot"
          git config user.email "media-engine-bot@users.noreply.github.com"
          git add outputs || true
          git diff --cached --quiet && exit 0
          git commit -m "align outputs [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
