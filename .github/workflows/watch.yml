name: watch
# Gemini watches a public YouTube video (picture + sound) for each changed jobs/watch/*.json
on:
  push:
    branches: [main]
    paths: ['jobs/watch/*.json']
  workflow_dispatch:
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run watch jobs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'jobs/watch/*.json' || true)
          for f in $CHANGED; do [ -f "$f" ] && python3 tools/gemini_watch.py "$f"; done
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "media-engine-bot"
          git config user.email "media-engine-bot@users.noreply.github.com"
          git add outputs/watch || true
          git diff --cached --quiet && exit 0
          git commit -m "watch outputs [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
