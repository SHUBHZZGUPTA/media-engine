name: viral
# Runs when a job file is pushed to jobs/viral/. Lists public videos with yt-dlp and commits the listings.
on:
  push:
    branches: [main]
    paths: ['jobs/viral/*.json']
permissions:
  contents: write
concurrency:
  group: viral
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yt-dlp
      - name: Collect
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'jobs/viral/*.json' || true)
          for f in $CHANGED; do [ -f "$f" ] && python3 tools/yt_collect.py "$f"; done
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "media-engine-bot"
          git config user.email "media-engine-bot@users.noreply.github.com"
          git add outputs || true
          git diff --cached --quiet && exit 0
          git commit -m "viral outputs [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
