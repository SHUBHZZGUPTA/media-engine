name: ytupdate
# Changes status fields (e.g. the synthetic-content label) of a channel's own video. Runs when a job file is pushed to jobs/ytupdate/
on:
  push:
    branches: [main]
    paths: ['jobs/ytupdate/*.json']
permissions:
  contents: write
concurrency:
  group: ytupdate
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q google-api-python-client google-auth
      - name: Update video status
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_RT_MM_EN: ${{ secrets.YT_RT_MM_EN }}
          YT_RT_MM_HI: ${{ secrets.YT_RT_MM_HI }}
          YT_RT_BHUGOL_EN: ${{ secrets.YT_RT_BHUGOL_EN }}
          YT_RT_BHUGOL_HI: ${{ secrets.YT_RT_BHUGOL_HI }}
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'jobs/ytupdate/*.json' || true)
          for f in $CHANGED; do [ -f "$f" ] && python3 tools/yt_update.py "$f"; done
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "media-engine-bot"
          git config user.email "media-engine-bot@users.noreply.github.com"
          git add outputs || true
          git diff --cached --quiet && exit 0
          git commit -m "ytupdate outputs [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
