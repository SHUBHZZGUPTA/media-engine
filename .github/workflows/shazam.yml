name: shazam
# Identifies background-music tracks in short audio snippets (snips/*.mp3) pushed on a shazam/* branch.
on:
  push:
    branches: ['shazam/**']
permissions:
  contents: write
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q shazamio && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: python3 shazam_snips.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "media-engine-bot"
          git config user.email "media-engine-bot@users.noreply.github.com"
          git add results.json || true
          git diff --cached --quiet && exit 0
          git commit -m "shazam results [skip ci]"
          git push
