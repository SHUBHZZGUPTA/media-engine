name: depth
# Runs when a job file is pushed to jobs/depth/. Makes depth maps and 2x upscales of scene art on CPU
# (Depth-Anything-V2-Small + Real-ESRGAN x2plus) and commits them under outputs/depth/<id>/.
on:
  push:
    branches: [main]
    paths: ['jobs/depth/*.json']
permissions:
  contents: write
concurrency:
  group: depth
  cancel-in-progress: false
jobs:
  depth:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 60
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers spandrel pillow numpy
      - name: Run
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'jobs/depth/*.json' || true)
          # GitHub keeps only ONE pending run per concurrency group: a job pushed while another runs can be silently
          # replaced by a later push and never run (22 Oct 2026). So also pick up any depth job added or changed in the
          # last 12 hours that still has no outputs.
          RECENT=$(git log --since="12 hours ago" --name-only --format= -- 'jobs/depth/*.json' | sort -u || true)
          for f in $RECENT; do id=$(basename "$f" .json); [ -f "$f" ] && [ ! -f "outputs/depth/$id/log.txt" ] && CHANGED="$CHANGED $f"; done
          CHANGED=$(echo $CHANGED | tr ' ' '\n' | sort -u)
          for f in $CHANGED; do [ -f "$f" ] || continue; id=$(basename "$f" .json); mkdir -p outputs/depth/$id; python3 tools/depth_upscale.py "$f" > outputs/depth/$id/log.txt 2>&1 || echo "FAILED $?" >> outputs/depth/$id/log.txt; done
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "media-engine-bot"
          git config user.email "media-engine-bot@users.noreply.github.com"
          git add outputs || true
          git diff --cached --quiet && exit 0
          git commit -m "depth outputs [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
