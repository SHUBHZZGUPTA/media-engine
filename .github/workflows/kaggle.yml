name: kaggle
# Runs a GPU job on Kaggle when a job file is pushed to jobs/kaggle/, or on demand from the
# Actions tab. Uses the KAGGLE_API_TOKEN secret (never printed) and commits the results to
# outputs/kaggle/<job-id>/. GPU time comes out of the Kaggle account's free weekly quota.
on:
  push:
    branches: [main]
    paths: ['jobs/kaggle/*.json']
  workflow_dispatch:
    inputs:
      job:
        description: 'Job file to run'
        required: true
        default: 'jobs/kaggle/gpu-check.json'
      mode:
        description: 'run = start on Kaggle and wait; collect = wait for and fetch a run left going; status = one quick check'
        type: choice
        options: [run, collect, status]
        default: run
permissions:
  contents: write
concurrency:
  group: kaggle
  cancel-in-progress: false
jobs:
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Kaggle CLI
        run: pip install -q kaggle==2.2.4
      - name: Run jobs on Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          JOB: ${{ github.event.inputs.job }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          set -e
          if [ -n "$JOB" ]; then
            FLAG=""; [ "$MODE" = "collect" ] && FLAG="--collect"; [ "$MODE" = "status" ] && FLAG="--status"
            python3 tools/kaggle_run.py "$JOB" $FLAG
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'jobs/kaggle/*.json' || true)
            for f in $CHANGED; do [ -f "$f" ] && python3 tools/kaggle_run.py "$f"; done
          fi
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "media-engine-bot"
          git config user.email "media-engine-bot@users.noreply.github.com"
          git add outputs || true
          git diff --cached --quiet && exit 0
          git commit -m "kaggle outputs [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
