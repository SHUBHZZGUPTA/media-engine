name: ytdeep
# Read-only deep analytics (own channels: per-video analytics, retention, traffic, audience; competitors: public data). Runs when a job file is pushed to jobs/ytdeep/.
on:
  push:
    branches: [main]
    paths: ['jobs/ytdeep/*.json']
permissions:
  contents: write
concurrency:
  group: ytdeep
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: pip install -q pillow
      - name: Pull analytics
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_RT_MM_EN: ${{ secrets.YT_RT_MM_EN }}
          YT_RT_MM_HI: ${{ secrets.YT_RT_MM_HI }}
          YT_RT_BHUGOL_EN: ${{ secrets.YT_RT_BHUGOL_EN }}
          YT_RT_BHUGOL_HI: ${{ secrets.YT_RT_BHUGOL_HI }}
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'jobs/ytdeep/*.json' || true)
          for f in $CHANGED; do [ -f "$f" ] && python3 tools/yt_deep.py "$f"; done
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "media-engine-bot"
          git config user.email "media-engine-bot@users.noreply.github.com"
          git add outputs || true
          git diff --cached --quiet && exit 0
          git commit -m "ytdeep outputs [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
