<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>BHUGOL Budapest</title>
<script src="./gsap.min.js"></script>
<style>
@font-face { font-family: 'BSD'; font-weight: 800; src: url(assets/bsd800.woff2) format('woff2'); }
@font-face { font-family: 'BSD'; font-weight: 900; src: url(assets/bsd900.woff2) format('woff2'); }
@font-face { font-family: 'Emo'; src: url(assets/emoji.ttf); }
@font-face { font-family: 'Arch'; font-weight: 800; src: url(assets/arch800.woff2) format('woff2'); }
:root { --mari: #FFC23A; --white: #F4F8FB; --water: #4FD3F2; --ink: #03101A; --red: #FF4D4D; }
body { margin: 0; background: #02070D; }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #02070D; }
#stage { position: absolute; inset: 0; }
.scr { position: absolute; inset: 0; pointer-events: none; }
.scene { position: absolute; inset: 0; overflow: hidden; opacity: 0; }
.push { position: absolute; inset: 0; }
.cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.cam img.plate { position: absolute; left: 0; top: 0; display: block; }
.cam svg { position: absolute; left: 0; top: 0; overflow: visible; }
.chars { position: absolute; inset: 0; }
.char { position: absolute; opacity: 0; }
.char img { position: absolute; inset: 0; width: 100%; height: 100%; }
.shadow { position: absolute; height: 54px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(0,0,0,.45), rgba(0,0,0,0) 70%); opacity: 0; }
.lbl { font-family: 'BSD', sans-serif; font-weight: 900; fill: var(--white); stroke: var(--ink); paint-order: stroke fill; letter-spacing: .06em; }
#vig { background: radial-gradient(ellipse 75% 60% at 50% 45%, rgba(2,7,13,0) 55%, rgba(2,7,13,.7) 100%); }
#topFade { height: 560px; bottom: auto; background: linear-gradient(rgba(2,7,13,.8) 0%, rgba(2,7,13,.4) 45%, rgba(2,7,13,0) 100%); }
#capFade { top: 1170px; height: 520px; bottom: auto; background: linear-gradient(rgba(2,7,13,0), rgba(2,7,13,.55) 45%, rgba(2,7,13,0)); }
#dim { background: #02070D; opacity: 0; }
#flash { background: #fff8e6; opacity: 0; }
#snow { opacity: 0; }
.flake { position: absolute; left: 0; top: 0; border-radius: 50%; background: #fff; }
#eng { opacity: 0; }
.emo { position: absolute; font-family: 'Emo', sans-serif; font-size: 230px; line-height: 1; }
.ttl, .cap { position: absolute; inset: 0; opacity: 0; }
.tl { position: absolute; left: 60px; width: 960px; text-align: center; white-space: nowrap; paint-order: stroke fill; -webkit-text-stroke-color: #03101A; color: var(--white); line-height: 1; }
.tl.big { font-family: 'BSD', sans-serif; font-weight: 900; letter-spacing: .01em; }
.tl.small { font-family: 'Arch', sans-serif; font-weight: 800; letter-spacing: .12em; }
.k { color: var(--mari); }
.cl { position: absolute; left: 195px; width: 740px; text-align: center; white-space: nowrap; font-family: 'BSD', sans-serif; font-weight: 900; color: var(--white); paint-order: stroke fill; -webkit-text-stroke-color: #02070D; line-height: 1; }
.cl span { opacity: 0; }
#badgeWrap { position: absolute; left: 230px; top: 450px; width: 620px; height: 620px; opacity: 0; transform-origin: 0 0; }
#badgeShadow { position: absolute; inset: 4% 3% -4% 3%; border-radius: 50%; background: rgba(0,0,0,.45); filter: blur(8px); }
#badge { position: absolute; inset: 0; width: 100%; height: 100%; }
#follow { position: absolute; left: 220px; top: 1125px; width: 640px; height: 130px; opacity: 0; }
#folBtn { position: absolute; inset: 0; border-radius: 65px; background: var(--water); box-sizing: border-box; }
#folTxt, #folTxt2 { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'BSD', sans-serif; font-weight: 900; font-size: 66px; letter-spacing: .05em; color: var(--ink); }
#folTxt2 { color: var(--water); opacity: 0; }
#tapDot { position: absolute; left: 0; top: 0; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.85); border: 3px solid var(--ink); opacity: 0; }
#ripple { position: absolute; left: 20px; top: -235px; width: 600px; height: 600px; box-sizing: border-box; border-radius: 50%; border: 6px solid rgba(255,255,255,.6); opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="__DUR__">
  <div id="stage" class="clip" data-start="0" data-duration="__DUR__">
    <div id="shake" class="scr"><div id="scenes" class="scr"></div></div>
    <div id="snow" class="scr"></div>
    <div id="eng" class="scr"></div>
    <div id="vig" class="scr"></div>
    <div id="dim" class="scr"></div>
    <div id="flash" class="scr"></div>
    <div id="topFade" class="scr"></div>
    <div id="capFade" class="scr"></div>
    <div id="titles" class="scr"></div>
    <div id="caps" class="scr"></div>
    <div id="badgeWrap"><div id="badgeShadow"></div><img id="badge" src="assets/bhugol_badge.png" alt="" /></div>
    <div id="follow"><div id="folBtn"></div><div id="folTxt"></div><div id="folTxt2"></div><div id="ripple"></div><div id="tapDot"></div></div>
  </div>
</div>
<script>
const D = __DATA__;
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const mk = (tag, attrs, parent, ns) => { const e = ns ? document.createElementNS(NS, tag) : document.createElement(tag); for (const k in attrs || {}) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const markup = (txt, el) => { let key = false; txt.split(' ').forEach((w, i) => { let word = w; if (word.startsWith('*')) { key = true; word = word.slice(1); } const end = word.endsWith('*'); if (end) word = word.slice(0, -1);
  const s = document.createElement('span'); if (key) s.className = 'k'; s.textContent = (i ? ' ' : '') + word; el.appendChild(s); if (end) key = false; }); };
const C = (li, ci, off) => D.C[li + '.' + (ci || 0)] + (off || 0);
const LN = D.LN;

/* ---------- scenes (one DOM instance per shot) ---------- */
const H = 760, FEET = 1215, POS = { L: 300, R: 790, M: 545 };
function scene(plate) {
  const [iw, ih] = D.pl[plate]; const s0 = Math.max(1080 / iw, 1920 / ih) * 1.02;
  const el = mk('div', { class: 'scene' }, $('scenes')); const push = mk('div', { class: 'push' }, el);
  const cam = mk('div', { class: 'cam' }, push); Object.assign(cam.style, { width: iw + 'px', height: ih + 'px' });
  const img = mk('img', { class: 'plate', src: `assets/${plate}.jpg`, alt: '', width: iw, height: ih }, cam);
  const svg = mk('svg', { width: iw, height: ih, viewBox: `0 0 ${iw} ${ih}` }, cam, true);
  const chars = mk('div', { class: 'chars' }, push);
  return { el, push, cam, img, svg, chars, iw, ih, s0, st: { x: iw / 2, y: ih / 2, z: 1 } };
}
function camApply(S) { const s = S.s0 * S.st.z; let L = 540 - S.st.x * s, T = 900 - S.st.y * s;
  L = Math.min(0, Math.max(1080 - S.iw * s, L)); T = Math.min(0, Math.max(1920 - S.ih * s, T));
  S.cam.style.transform = `translate(${L.toFixed(2)}px,${T.toFixed(2)}px) scale(${s.toFixed(5)})`; }
function addChar(S, name, side) { const w = Math.min(560, H * D.ar[name]); const x = POS[side];
  const sh = mk('div', { class: 'shadow' }, S.chars); Object.assign(sh.style, { left: (x - w * .42) + 'px', top: (FEET - 30) + 'px', width: (w * .84) + 'px' });
  const c = mk('div', { class: 'char' }, S.chars); Object.assign(c.style, { left: (x - w / 2) + 'px', top: (FEET - H) + 'px', width: w + 'px', height: H + 'px' });
  mk('img', { src: `assets/${name}.png`, alt: '' }, c); return { c, sh, x }; }
const P = (S, d, a) => mk('path', Object.assign({ d, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, a), S.svg, true);
const T = (S, txt, x, y, fs, a) => { const e = mk('text', Object.assign({ x, y, 'font-size': fs, 'text-anchor': 'middle', class: 'lbl', 'stroke-width': fs * .2, opacity: 0 }, a), S.svg, true); e.textContent = txt; return e; };
const xMark = (S, x, y, r) => { const g = mk('g', { opacity: 0 }, S.svg, true);
  mk('path', { d: `M${x - r},${y - r} L${x + r},${y + r} M${x + r},${y - r} L${x - r},${y + r}`, stroke: '#03101A', 'stroke-width': r * .55, 'stroke-linecap': 'round' }, g, true);
  mk('path', { d: `M${x - r},${y - r} L${x + r},${y + r} M${x + r},${y - r} L${x - r},${y + r}`, stroke: '#FF4D4D', 'stroke-width': r * .36, 'stroke-linecap': 'round' }, g, true); return g; };

const RIVER = 'M550,0 C600,120 640,260 590,390 C555,480 525,560 520,640 C512,740 470,820 488,940 C500,1030 480,1160 470,1280 C465,1400 520,1480 560,1536';
function aerial() { const S = scene('plate_aerial');
  S.glow = P(S, RIVER, { stroke: '#4FD3F2', 'stroke-width': 150, opacity: 0, style: 'filter: blur(14px)' });
  S.sight = P(S, 'M240,450 Q520,330 790,470', { stroke: '#FFC23A', 'stroke-width': 12, 'stroke-dasharray': '30 22', opacity: 0 });
  S.sightHead = P(S, 'M760,440 L795,472 L752,488', { stroke: '#FFC23A', 'stroke-width': 12, opacity: 0 });
  S.buda = T(S, 'BUDA', 225, 340, 92); S.pest = T(S, 'PEST', 830, 560, 92);
  S.danube = T(S, 'DANUBE', 0, 0, 62, { transform: 'translate(565,480) rotate(-78)', fill: '#4FD3F2' });
  S.x = xMark(S, 512, 700, 58);
  return S; }

const A1 = aerial(), R1 = scene('plate_river'), EU = scene('europe'), R2 = scene('plate_river'), A2 = aerial(), TL = scene('plate_toll'), A3 = aerial();
// characters
A1.cBuda = addChar(A1, 'c_buda', 'L'); A1.cPest = addChar(A1, 'c_pest', 'R');
R2.cCount = addChar(R2, 'c_count', 'L');
TL.cToll = addChar(TL, 'c_toll', 'L'); TL.cNoble = addChar(TL, 'c_noble', 'R');
A3.cBuda = addChar(A3, 'c_buda', 'L'); A3.cPest = addChar(A3, 'c_pest', 'R'); A3.cOb = addChar(A3, 'c_obuda', 'M');
// bridge of boats + ice (river shot 1)
R1.boats = []; for (let k = 0; k < 7; k++) { const t = k / 6, y = 860 - t * 340, s = 1.7 - t * 1.1, x = 512 + Math.sin(k * 1.7) * 8;
  const g = mk('g', { opacity: 0, transform: `translate(${x},${y}) scale(${s})` }, R1.svg, true);
  mk('path', { d: 'M-70,0 Q0,34 70,0 L56,-16 L-56,-16 Z', fill: '#5B3A1E', stroke: '#2A1A0C', 'stroke-width': 5 }, g, true);
  mk('rect', { x: -78, y: -26, width: 156, height: 12, fill: '#8A6236', stroke: '#2A1A0C', 'stroke-width': 4 }, g, true);
  R1.boats.push(g); }
R1.x = xMark(R1, 512, 650, 90);
// Europe map: pins + dimension line
const bud = D.eu.bud, vie = D.eu.vie;
EU.pinB = mk('circle', { cx: bud.x, cy: bud.y, r: 16, fill: '#FFC23A', stroke: '#03101A', 'stroke-width': 6, opacity: 0 }, EU.svg, true);
EU.ringB = mk('circle', { cx: bud.x, cy: bud.y, r: 16, fill: 'none', stroke: '#FFC23A', 'stroke-width': 5, opacity: 0 }, EU.svg, true);
EU.pinV = mk('circle', { cx: vie.x, cy: vie.y, r: 16, fill: '#F4F8FB', stroke: '#03101A', 'stroke-width': 6, opacity: 0 }, EU.svg, true);
EU.vie = T(EU, 'VIENNA', vie.x, vie.y - 40, 72);
const dl = Math.hypot(bud.x - vie.x, bud.y - vie.y);
EU.dim = P(EU, `M${bud.x},${bud.y} L${vie.x},${vie.y}`, { stroke: '#FFC23A', 'stroke-width': 9, 'stroke-dasharray': dl, 'stroke-dashoffset': dl, opacity: 0 });
EU.km = T(EU, '250 KM', (bud.x + vie.x) / 2 + 10, (bud.y + vie.y) / 2 + 80, 64, { fill: '#FFC23A' });
// chain bridge drawn across the river (aerial shots 2 and 3)
for (const S of [A2, A3]) {
  const d = 'M385,624 L655,624 M392,612 L440,586 Q520,642 600,586 L648,612';
  S.brO = P(S, d, { stroke: '#03101A', 'stroke-width': 16, 'stroke-dasharray': 900, 'stroke-dashoffset': S === A2 ? 900 : 0 });
  S.br = P(S, d, { stroke: '#FFC23A', 'stroke-width': 8, 'stroke-dasharray': 900, 'stroke-dashoffset': S === A2 ? 900 : 0 });
  S.towers = mk('g', { opacity: S === A2 ? 0 : 1 }, S.svg, true);
  for (const tx of [440, 600]) mk('rect', { x: tx - 9, y: 578, width: 18, height: 56, fill: '#FFC23A', stroke: '#03101A', 'stroke-width': 5 }, S.towers, true);
}
A3.warm = [P(A3, 'M90,520 L300,520', { stroke: '#FFC23A', 'stroke-width': 260, opacity: 0, style: 'filter: blur(40px)' }),
           P(A3, 'M720,620 L960,620', { stroke: '#FFC23A', 'stroke-width': 300, opacity: 0, style: 'filter: blur(40px)' })];
A3.ob = T(A3, 'ÓBUDA', 175, 262, 76); A3.obSub = T(A3, '“OLD BUDA”', 175, 312, 40, { fill: '#FFC23A' });
A3.obRing = mk('ellipse', { cx: 175, cy: 225, rx: 185, ry: 125, fill: 'none', stroke: '#FFC23A', 'stroke-width': 9, 'stroke-dasharray': 960, 'stroke-dashoffset': 960, opacity: 0 }, A3.svg, true);
// toll sign
TL.sign = mk('g', { opacity: 0 }, TL.svg, true);
mk('rect', { x: 120, y: 420, width: 200, height: 84, rx: 8, fill: '#8A5A2B', stroke: '#2A1A0C', 'stroke-width': 7 }, TL.sign, true);
{ const t = mk('text', { x: 220, y: 482, 'font-size': 62, 'text-anchor': 'middle', fill: '#FFE2A8', 'font-family': 'BSD', 'font-weight': 900, 'letter-spacing': '.08em' }, TL.sign, true); t.textContent = 'TOLL'; }
// engineers
const eng = $('eng');
const e1 = mk('div', { class: 'emo' }, eng), e2 = mk('div', { class: 'emo' }, eng); e1.textContent = e2.textContent = '👷‍♂️';
Object.assign(e1.style, { left: '200px', top: '360px' }); Object.assign(e2.style, { left: '650px', top: '360px' });
const esvg = mk('svg', { width: 1080, height: 1920, viewBox: '0 0 1080 1920', style: 'position:absolute;left:0;top:0' }, eng, true);
const linkL = mk('path', { d: 'M440,500 L540,500', stroke: '#FFC23A', 'stroke-width': 14, 'stroke-dasharray': '24 16', 'stroke-linecap': 'round' }, esvg, true);
const linkR = mk('path', { d: 'M540,500 L640,500', stroke: '#FFC23A', 'stroke-width': 14, 'stroke-dasharray': '24 16', 'stroke-linecap': 'round' }, esvg, true);
// snow (deterministic)
const FL = []; for (let k = 0; k < 70; k++) { const f = mk('div', { class: 'flake' }, $('snow')); const r = 3 + ((k * 37) % 9);
  Object.assign(f.style, { width: r * 2 + 'px', height: r * 2 + 'px', opacity: .5 + ((k * 13) % 5) / 10 }); FL.push({ f, x: (k * 157) % 1080, y0: (k * 263) % 1920, sp: 140 + ((k * 71) % 160), r }); }

/* ---------- titles + captions ---------- */
const TT = {};
for (const t of D.titles) { const g = mk('div', { class: 'ttl', id: t.id }, $('titles')); const lines = [];
  t.lines.forEach((ln0, i) => { const small = ln0.startsWith('~'); const ln = small ? ln0.slice(1) : ln0; const size = small ? 58 : 132;
    const d = mk('div', { class: 'tl ' + (small ? 'small' : 'big') }, g); const base = 300 + (i === 0 ? 0 : (small ? 74 : 124));
    Object.assign(d.style, { fontSize: size + 'px', top: (base - size * .8) + 'px', webkitTextStrokeWidth: (size * .14) + 'px' }); markup(ln, d); lines.push(d); });
  TT[t.id] = { g, t, lines }; }
const CAPS = D.chunks.map(c => { const g = mk('div', { class: 'cap' }, $('caps'));
  const lines = c.txt.split('|').map(ln => { const d = mk('div', { class: 'cl' }, g); markup(ln, d); return d; });
  return { c, g, lines, words: [...g.querySelectorAll('span')] }; });
$('folTxt').textContent = D.end.button; $('folTxt2').textContent = '✓ ' + D.end.following;
function layout() {
  for (const K of CAPS) { let fs = 92; K.g.style.opacity = 1;
    for (const d of K.lines) { d.style.fontSize = '92px'; const w = d.scrollWidth; if (w > 740) fs = Math.min(fs, 92 * 740 / w); }
    K.g.style.opacity = 0; const n = K.lines.length;
    K.lines.forEach((d, i) => Object.assign(d.style, { fontSize: fs.toFixed(1) + 'px', webkitTextStrokeWidth: (fs * .17).toFixed(1) + 'px', top: (1385 + (i - (n - 1) / 2) * fs - fs * .5).toFixed(1) + 'px' })); }
  for (const id in TT) { const { g, lines } = TT[id]; g.style.opacity = 1;
    for (const d of lines) { const w = d.scrollWidth, fs = parseFloat(d.style.fontSize); if (w > 960) d.style.fontSize = (fs * 960 / w).toFixed(1) + 'px'; }
    g.style.opacity = 0; }
}

/* ---------- timeline ---------- */
function build() {
  layout();
  const tl = gsap.timeline({ paused: true }); const IR = { immediateRender: false };
  const camTo = (S, x, y, z, at, dur, ease) => { const from = Object.assign({}, S.st); S.st = { x, y, z };
    const o = Object.assign({}, from); tl.fromTo(o, from, { x, y, z, duration: dur, ease: ease || 'power2.inOut', ...IR, onUpdate: () => { Object.assign(S._live || (S._live = {}), o); S.st2 = o; camApplyLive(S, o); } }, at); };
  const camApplyLive = (S, o) => { const keep = S.st; S.st = o; camApply(S); S.st = keep; };
  const camSet = (S, x, y, z) => { S.st = { x, y, z }; camApplyLive(S, { x, y, z }); };
  // shots: [scene, in, out]
  const shots = [[A1, 0, C(7, 0, -.15)], [R1, C(7, 0, -.15), C(7, 4, -.25)], [EU, C(7, 4, -.25), C(8, 0, -.2)], [R2, C(8, 0, -.2), C(10, 0, -.2)],
    [A2, C(10, 0, -.2), C(12, 0, -.2)], [TL, C(12, 0, -.2), C(14, 0, -.2)], [A3, C(14, 0, -.2), D.dur + 1]];
  shots.forEach(([S, a, b], i) => {
    if (i === 0) tl.set(S.el, { opacity: 1, x: 0 }, 0);
    else tl.fromTo(S.el, { opacity: 1, x: 1080 }, { opacity: 1, x: 0, duration: .35, ease: 'power3.out', ...IR }, a);
    if (i < shots.length - 1) { tl.to(S.el, { x: -1080, duration: .35, ease: 'power3.in' }, b); tl.set(S.el, { opacity: 0 }, b + .36); }
  });
  const talk = (ch, a, b) => { const n = Math.max(2, Math.floor((b - a) / .32));
    tl.fromTo(ch.c, { scaleY: 1, rotation: 0, transformOrigin: '50% 100%' }, { keyframes: Array.from({ length: n }, (_, i) => [{ scaleY: 1.05, rotation: i % 2 ? 2.2 : -2.2, duration: .16 }, { scaleY: 1, rotation: 0, duration: .16 }]).flat(), ...IR }, a); };
  const enter = (ch, at, from) => { tl.fromTo(ch.c, from === 'L' ? { opacity: 0, x: -520 } : from === 'R' ? { opacity: 0, x: 520 } : { opacity: 0, y: 420 }, { opacity: 1, x: 0, y: 0, duration: .5, ease: 'back.out(1.7)', ...IR }, at);
    tl.to(ch.sh, { opacity: 1, duration: .3 }, at + .1); };
  const leave = (ch, at, to) => { tl.to(ch.c, to === 'L' ? { x: -600, opacity: 0, duration: .35, ease: 'power3.in' } : to === 'R' ? { x: 600, opacity: 0, duration: .35, ease: 'power3.in' } : { y: 500, opacity: 0, duration: .35, ease: 'power3.in' }, at);
    tl.to(ch.sh, { opacity: 0, duration: .2 }, at); };
  const zoomTo = (S, ch, a, b) => { tl.to(S.push, { scale: 1.22, x: (540 - ch.x) * .5, y: -40, duration: .28, ease: 'power3.out', transformOrigin: '540px 900px' }, a - .18);
    tl.to(S.push, { scale: 1, x: 0, y: 0, duration: .35, ease: 'power2.inOut' }, b + .1); };
  const pop = (el, at, s0) => tl.fromTo(el, { opacity: 0, scale: s0 || .5, transformOrigin: '50% 50%', transformBox: 'fill-box' }, { opacity: 1, scale: 1, duration: .4, ease: 'back.out(2.4)', ...IR }, at);
  const fade = (el, at, d) => tl.to(el, { opacity: 0, duration: d || .3 }, at);
  const shake = at => tl.fromTo($('shake'), { x: 0, y: 0 }, { keyframes: [{ x: -20, y: 12, duration: .05 }, { x: 16, y: -10, duration: .05 }, { x: -10, y: 7, duration: .06 }, { x: 6, y: -4, duration: .06 }, { x: 0, y: 0, duration: .08 }], ...IR }, at);
  const draw = (el, at, dur) => tl.to(el, { attr: { 'stroke-dashoffset': 0 }, duration: dur, ease: 'power1.inOut' }, at);

  // ===== A1: hook + rivals + Danube =====
  camSet(A1, 520, 660, 1.75, 0);
  camTo(A1, 520, 560, 1.0, .1, C(0, 1) - .1, 'sine.inOut');
  camTo(A1, 520, 640, 1.3, C(0, 2), 1.0, 'power3.inOut');
  camTo(A1, 520, 700, 1.05, C(0, 3), C(1, 0) - C(0, 3), 'sine.inOut');
  camTo(A1, 215, 360, 1.75, C(1, 0), .9, 'power3.inOut');
  camTo(A1, 185, 260, 2.1, C(1, 0, .9), C(2, 0) - C(1, 0, .9), 'sine.inOut');
  camTo(A1, 820, 640, 1.75, C(2, 0), .9, 'power3.inOut');
  camTo(A1, 840, 720, 2.05, C(2, 0, .9), C(3, 0, -.35) - C(2, 0, .9), 'sine.inOut');
