<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>BHUGOL Danube 3D</title>
<script src="./gsap.min.js"></script>
<script src="./three.min.js"></script>
<script src="./motion.js"></script>
<script src="./shader_xfade.js"></script>
<style>
@font-face { font-family: 'BSD'; font-weight: 800; src: url(assets/bsd800.woff2) format('woff2'); }
@font-face { font-family: 'BSD'; font-weight: 900; src: url(assets/bsd900.woff2) format('woff2'); }
@font-face { font-family: 'Emo'; src: url(assets/emoji.ttf); }
@font-face { font-family: 'Arch'; font-weight: 800; src: url(assets/arch800.woff2) format('woff2'); }
@font-face { font-family: 'Muk'; font-weight: 800; src: url(assets/muk800.woff2) format('woff2'); }
@font-face { font-family: 'Muk'; font-weight: 700; src: url(assets/muk700.woff2) format('woff2'); }
:root { --mari: #FFC23A; --white: #F4F8FB; --fire: #FF7A1A; --ink: #03101A; }
body { margin: 0; background: #02070D; }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #02070D; }
#stage { position: absolute; inset: 0; }
.scr { position: absolute; inset: 0; pointer-events: none; }
.scene { position: absolute; inset: 0; overflow: hidden; opacity: 0; }
.push { position: absolute; inset: 0; }
.cv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
.chars { position: absolute; inset: 0; }
.char { position: absolute; opacity: 0; }
.char img { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 18px 22px rgba(0,0,0,.55)); }
.shadow { position: absolute; height: 54px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(0,0,0,.5), rgba(0,0,0,0) 70%); opacity: 0; }
.ov { position: absolute; inset: 0; }
.plbl { position: absolute; left: 0; top: 0; white-space: nowrap; font-family: 'BSD', 'Muk', 'Emo', sans-serif; font-weight: 900; color: var(--white); paint-order: stroke fill; -webkit-text-stroke-color: #03101A; line-height: 1; opacity: 0; }
#vig { background: radial-gradient(ellipse 75% 60% at 50% 45%, rgba(2,7,13,0) 55%, rgba(2,7,13,.66) 100%); }
#topFade { height: 560px; bottom: auto; background: linear-gradient(rgba(2,7,13,.75) 0%, rgba(2,7,13,.35) 45%, rgba(2,7,13,0) 100%); }
#capFade { top: 1170px; height: 520px; bottom: auto; background: linear-gradient(rgba(2,7,13,0), rgba(2,7,13,.55) 45%, rgba(2,7,13,0)); }
#dim { background: #02070D; opacity: 0; }
#flash { background: #ffffff; opacity: 0; }
#heat { background: radial-gradient(ellipse 80% 55% at 50% 60%, rgba(255,110,20,.5), rgba(255,60,0,0) 70%); opacity: 0; mix-blend-mode: screen; }
.emo { position: absolute; font-family: 'Emo', sans-serif; font-size: 200px; line-height: 1; opacity: 0; filter: drop-shadow(0 10px 12px rgba(0,0,0,.5)); }
.ttl, .cap { position: absolute; inset: 0; opacity: 0; }
.tl { position: absolute; left: 60px; width: 960px; text-align: center; white-space: nowrap; paint-order: stroke fill; -webkit-text-stroke-color: #03101A; color: var(--white); line-height: 1; }
.tl.big { font-family: 'BSD', 'Muk', 'Emo', sans-serif; font-weight: 900; letter-spacing: .01em; }
.tl.small { font-family: 'Arch', 'Muk', sans-serif; font-weight: 800; letter-spacing: .12em; }
.k { color: var(--mari); }
.cl { position: absolute; left: 195px; width: 740px; text-align: center; white-space: nowrap; font-family: 'BSD', 'Muk', 'Emo', sans-serif; font-weight: 900; color: var(--white); paint-order: stroke fill; -webkit-text-stroke-color: #02070D; line-height: 1; }
.hi .cl, .hi .tl.big, .hi .plbl { letter-spacing: 0; }
.cl span { opacity: 0; display: inline-block; white-space: pre; }
#badgeWrap { position: absolute; left: 230px; top: 450px; width: 620px; height: 620px; opacity: 0; transform-origin: 0 0; }
#badgeShadow { position: absolute; inset: 4% 3% -4% 3%; border-radius: 50%; background: rgba(0,0,0,.45); filter: blur(8px); }
#badge { position: absolute; inset: 0; width: 100%; height: 100%; }
#follow { position: absolute; left: 220px; top: 1125px; width: 640px; height: 130px; opacity: 0; }
#folBtn { position: absolute; inset: 0; border-radius: 65px; background: var(--fire); box-sizing: border-box; }
#folTxt, #folTxt2 { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'BSD', 'Muk', sans-serif; font-weight: 900; font-size: 66px; letter-spacing: .05em; color: var(--ink); }
#folTxt2 { color: var(--fire); opacity: 0; }
#tapDot { position: absolute; left: 0; top: 0; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.85); border: 3px solid var(--ink); opacity: 0; }
.kbox { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; line-height: 1; opacity: 0; }
.knum, .ksuf { display: inline-block; font-family: 'BSD', 'Muk', sans-serif; font-weight: 900; paint-order: stroke fill; -webkit-text-stroke-color: #03101A; }
.knum { font-size: 230px; -webkit-text-stroke-width: 30px; color: var(--fire); text-shadow: 0 0 40px rgba(255,90,20,.55); }
.ksuf { font-size: 120px; -webkit-text-stroke-width: 18px; color: var(--white); margin-left: 26px; }
.flapRow { display: flex; justify-content: center; gap: 7px; }
.flap { display: inline-block; width: 66px; height: 104px; border-radius: 10px; background: linear-gradient(#1A2230 0 49%, #0B1018 51% 100%); color: #F4F8FB; font-family: 'BSD', sans-serif; font-weight: 900;
  font-size: 92px; line-height: 104px; text-align: center; box-shadow: 0 6px 0 rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.07); transform-origin: 50% 50%; }
.flapLbl { font-family: 'Arch', sans-serif; font-weight: 800; font-size: 44px; letter-spacing: .2em; color: var(--mari); margin-bottom: 14px; paint-order: stroke fill; -webkit-text-stroke: 8px #03101A; }
.card { position: absolute; left: 0; top: 0; width: 560px; opacity: 0; }
.cin { background: rgba(6,12,22,.88); border: 4px solid var(--fire); border-radius: 26px; padding: 22px 30px 24px; box-shadow: 0 18px 40px rgba(0,0,0,.6); }
.crow { display: flex; align-items: center; gap: 14px; font-family: 'Arch', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: .08em; color: var(--white); }
.cflag { font-family: 'Emo', sans-serif; font-size: 50px; }
.cbig { margin-top: 6px; font-family: 'BSD', sans-serif; font-weight: 900; color: var(--mari); line-height: 1; }
.cnum { display: inline-block; font-size: 128px; } .csuf { display: inline-block; font-size: 64px; color: var(--white); margin-left: 14px; }
.ctag { margin-top: 10px; display: inline-block; padding: 6px 16px; border-radius: 40px; background: rgba(255,122,26,.18); color: var(--fire); font-family: 'Arch', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: .1em; }
.cl .k { color: #FFFFFF; }
#ripple { position: absolute; left: 20px; top: -235px; width: 600px; height: 600px; box-sizing: border-box; border-radius: 50%; border: 6px solid rgba(255,255,255,.6); opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="__DUR__">
  <div id="stage" class="clip" data-start="0" data-duration="__DUR__">
    <div id="shake" class="scr"><div id="cshake" class="scr"><div id="scenes" class="scr"></div></div></div>
    <div id="heat" class="scr"></div>
    <div id="fx" class="scr"></div>
    <div id="dim" class="scr"></div>
    <div id="flash" class="scr"></div>
    <div id="titles" class="scr"></div>
    <div id="caps" class="scr"></div>
    <div id="hook" class="scr"></div>
    <div id="badgeWrap"><div id="badgeShadow"></div><img id="badge" src="assets/bhugol_badge.png" alt="" /></div>
    <div id="follow"><div id="folBtn"></div><div id="folTxt"></div><div id="folTxt2"></div><div id="ripple"></div><div id="tapDot"></div></div>
  </div>
</div>
__MBLUR__
