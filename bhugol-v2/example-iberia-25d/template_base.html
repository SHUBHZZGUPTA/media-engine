<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>BHUGOL Nordic what-if</title>

<style>

.tl-fill { position: absolute; left: 4px; top: 154px; width: 0; height: 18px; border-radius: 10px; background: linear-gradient(90deg, #FFE08A, #FFB21A); }
.tl-y { position: absolute; top: 190px; font-family: 'BSD', sans-serif; font-weight: 900; font-size: 64px; color: #fff; paint-order: stroke fill; -webkit-text-stroke: 12px #03101A; }
.tl-big { position: absolute; left: 0; width: 860px; top: -10px; text-align: center; font-family: 'BSD', sans-serif; font-weight: 900; font-size: 140px; color: var(--gold); paint-order: stroke fill; -webkit-text-stroke: 22px #03101A; }
.stamp { position: absolute; left: 0; top: 0; opacity: 0; padding: 10px 36px; border: 10px solid var(--red); border-radius: 22px; color: var(--red); font-family: 'BSD', 'Emo', sans-serif; font-weight: 900; font-size: 110px;
  letter-spacing: .04em; background: rgba(255,255,255,.88); transform-origin: 50% 50%; white-space: nowrap; }
.vote { position: absolute; top: 380px; width: 430px; height: 200px; border-radius: 34px; opacity: 0; border: 6px solid #03101A; box-sizing: border-box; text-align: center;
  font-family: 'BSD', 'Emo', sans-serif; font-weight: 900; color: #03101A; box-shadow: 0 14px 0 rgba(3,16,26,.55); }
.vote .vt { font-size: 66px; padding-top: 16px; } .vote .vf { font-size: 56px; }
.ball { position: absolute; left: 0; top: 0; width: 300px; height: 300px; opacity: 0; transform-origin: 50% 100%; }
.bubble { position: absolute; left: 0; top: 0; opacity: 0; padding: 18px 34px; border-radius: 40px; background: #fff; border: 6px solid #03101A; font-family: 'BSD', 'Emo', sans-serif; font-weight: 900;
  font-size: 64px; color: #03101A; white-space: nowrap; transform-origin: 20% 100%; }
.bubble:after { content: ''; position: absolute; left: 60px; bottom: -34px; border: 18px solid transparent; border-top: 22px solid #03101A; }
#badge { position: absolute; left: 34px; top: 1712px; width: 150px; height: 150px; opacity: 0; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
.snow { position: absolute; left: 0; top: 0; width: 10px; height: 10px; border-radius: 50%; background: #fff; opacity: 0; }
.coin { position: absolute; left: 0; top: 0; font-family: 'Emo'; font-size: 90px; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="__DUR__">
  <div id="stage" class="clip" data-start="0" data-duration="__DUR__">
    <div id="shake" class="scr"><div id="cshake" class="scr">
      <div id="view"><div id="cam"></div></div>
      <div id="sepia" class="scr"></div><div id="warm" class="scr"></div>
      <div id="world2" class="scr"></div>
    </div></div>
    <div id="fx" class="scr"></div>
    <div id="hud" class="scr"></div>
    <div id="titles" class="scr"></div>
    <div id="caps" class="scr"></div>
    <div id="flash" class="scr"></div>
    <img id="badge" src="assets/bhugol_badge.png" alt="" />
  </div>
</div>
<script>
const D = __DATA__;
const NS = 'http://www.w3.org/2000/svg', $ = id => document.getElementById(id), M = D.map, PT = M.pt;
const mk = (tag, attrs, parent, ns) => { const e = ns ? document.createElementNS(NS, tag) : document.createElement(tag); for (const k in attrs || {}) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const C = (li, ci, off) => D.C[li + '.' + (ci || 0)] + (off || 0);
const LN = D.LN;
const markup = (txt, el) => { let key = false; txt.split(' ').forEach((w, i) => { let word = w; if (word.startsWith('*')) { key = true; word = word.slice(1); } const end = word.endsWith('*'); if (end) word = word.slice(0, -1);
  const s = document.createElement('span'); if (key) s.className = 'k'; s.textContent = (i ? ' ' : '') + word; el.appendChild(s); if (end) key = false; }); };

/* ================= world (one map, one continuous camera) ================= */
const cam = $('cam'); Object.assign(cam.style, { width: M.W + 'px', height: M.H + 'px' });
const ctx = mk('img', { src: 'assets/context.jpg', alt: '' }, cam); Object.assign(ctx.style, { left: '0px', top: '0px', width: M.W + 'px', height: M.H + 'px' });
const [dx, dy, dw, dh] = M.detail; const det = mk('img', { src: 'assets/detail.jpg', alt: '' }, cam); Object.assign(det.style, { left: dx + 'px', top: dy + 'px', width: dw + 'px', height: dh + 'px' });
const svg = mk('svg', { width: M.W, height: M.H, viewBox: `0 0 ${M.W} ${M.H}` }, cam, true);
const defs = mk('defs', {}, svg, true);
const gr = mk('linearGradient', { id: 'gold', x1: 0, y1: 0, x2: .3, y2: 1 }, defs, true);
mk('stop', { offset: 0, 'stop-color': '#FFE27A' }, gr, true); mk('stop', { offset: .55, 'stop-color': '#F6B630' }, gr, true); mk('stop', { offset: 1, 'stop-color': '#E08E1A' }, gr, true);
const ice = mk('linearGradient', { id: 'ice', x1: 0, y1: 0, x2: 1, y2: 1 }, defs, true);
mk('stop', { offset: 0, 'stop-color': '#FFFFFF' }, ice, true); mk('stop', { offset: 1, 'stop-color': '#A9DCFF' }, ice, true);
const shine = mk('linearGradient', { id: 'shine', x1: 0, y1: 0, x2: 1, y2: 0, gradientUnits: 'userSpaceOnUse' }, defs, true);
const sh0 = mk('stop', { offset: 0, 'stop-color': '#fff', 'stop-opacity': 0 }, shine, true), sh1 = mk('stop', { offset: .5, 'stop-color': '#fff', 'stop-opacity': .75 }, shine, true), sh2 = mk('stop', { offset: 1, 'stop-color': '#fff', 'stop-opacity': 0 }, shine, true);

// flags: pre-rendered PNG layers in world coordinates (fast to render), see bake_flags.cjs
const FL = {};
for (const k of ['ESP', 'PRT']) { const [x0, y0, x1, y1] = M.bbox[k]; const im = mk('img', { src: `assets/flag_${k}.png`, alt: '' }, cam);
  Object.assign(im.style, { left: (x0 - 4) + 'px', top: (y0 - 4) + 'px', width: (x1 - x0 + 8) + 'px', height: (y1 - y0 + 8) + 'px', opacity: 0 }); FL[k] = im; }
// country outlines (constant screen width)
const OUT = {}; for (const k in M.paths) OUT[k] = mk('path', { d: M.paths[k], fill: 'none', stroke: '#fff', 'stroke-width': 3, 'vector-effect': 'non-scaling-stroke', 'stroke-linejoin': 'round', opacity: .95 }, svg, true);
// Spain-Portugal land border (dashed, shown in the clock scene)
const STB = mk('path', { d: M.borders.states, fill: 'none', stroke: '#fff', 'stroke-width': 3.5, 'vector-effect': 'non-scaling-stroke', 'stroke-dasharray': '10 7', opacity: 0 }, svg, true);
// unified gold country: extrusion + fill + shine + rim
const goldG = mk('g', { opacity: 0 }, svg, true);
const extr = mk('path', { d: M.union, fill: '#7A4A0A' }, goldG, true);
const goldF = mk('path', { d: M.union, fill: 'url(#gold)' }, goldG, true);
const cpU = mk('clipPath', { id: 'cpU' }, defs, true); mk('path', { d: M.union }, cpU, true);
const shineR = mk('rect', { x: 0, y: 0, width: M.W, height: M.H, fill: 'url(#shine)', 'clip-path': 'url(#cpU)', opacity: 0 }, svg, true);
const rimW = mk('path', { d: M.union, fill: 'none', stroke: '#FFE7A0', 'stroke-width': 16, 'vector-effect': 'non-scaling-stroke', opacity: 0, 'stroke-linejoin': 'round' }, svg, true);
const rim = mk('path', { d: M.union, fill: 'none', stroke: '#FFF6D6', 'stroke-width': 4, 'vector-effect': 'non-scaling-stroke', opacity: 0, 'stroke-linejoin': 'round' }, svg, true);
const lights = mk('g', { opacity: 0 }, svg, true); for (const [x, y, r] of D.cities) mk('circle', { cx: x, cy: y, r, fill: '#FFF7D0' }, lights, true);
const P = PT, mid = (a, b) => [(P[a][0] + P[b][0]) / 2, (P[a][1] + P[b][1]) / 2];
const ptGold = mk('path', { d: M.paths.PRT, fill: 'url(#gold)', opacity: 0 }, svg, true);
const ruler = mk('path', { d: `M${P.madrid[0]},${P.madrid[1]} L${P.lisbon[0]},${P.lisbon[1]}`, fill: 'none', stroke: '#fff', 'stroke-width': 8, 'vector-effect': 'non-scaling-stroke', 'stroke-dasharray': '22 14', pathLength: 1, opacity: 0 }, svg, true);
const BGLOW = mk('path', { d: M.borders.states, fill: 'none', stroke: '#FFC23A', 'stroke-width': 16, 'vector-effect': 'non-scaling-stroke', 'stroke-linecap': 'round', opacity: 0 }, svg, true);

function flagSVG(k, w, h, inner) {
  let s = '';
  if (k === 'ESP') s = `<rect width="${w}" height="${h}" fill="#AA151B"/><rect y="${h / 4}" width="${w}" height="${h / 2}" fill="#F1BF00"/>`;
  else { const cx = w * .4, cy = h / 2, r = h * .2;
    s = `<rect width="${w}" height="${h}" fill="#DA291C"/><rect width="${w * .4}" height="${h}" fill="#046A38"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#FFE000" stroke-width="${h * .035}"/><ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r * .35}" fill="none" stroke="#FFE000" stroke-width="${h * .02}"/>
    <path d="M${cx - r * .55},${cy - r * .62} h${r * 1.1} v${r * .7} q0,${r * .55} -${r * .55},${r * .7} q-${r * .55},-${r * .15} -${r * .55},-${r * .7}Z" fill="#fff" stroke="#DA291C" stroke-width="${h * .03}"/>`; }
  return inner ? s : `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;border-radius:10px">${s}</svg>`;
}
/* ================= camera ================= */
const VX = 540, VY = 860, PERS = 2200;
const bez = (x1, y1, x2, y2) => t => { if (t <= 0) return 0; if (t >= 1) return 1; let u = t; for (let i = 0; i < 8; i++) { const x = 3 * (1 - u) * (1 - u) * u * x1 + 3 * (1 - u) * u * u * x2 + u * u * u - t;
  const dx = 3 * (1 - u) * (1 - u) * x1 + 6 * (1 - u) * u * (x2 - x1) + 3 * u * u * (1 - x2); if (Math.abs(dx) < 1e-6) break; u -= x / dx; u = Math.min(1, Math.max(0, u)); }
  return 3 * (1 - u) * (1 - u) * u * y1 + 3 * (1 - u) * u * u * y2 + u * u * u; };
const EASE = { glide: bez(.5, 0, .08, 1), snap: bez(.7, 0, .05, 1), soft: bez(.42, 0, .2, 1) };
const KEYS = D.cam; // [{at, dur, x, y, z, tilt, rot, ease}] — the first one is the opening pose
function camAt(t) {
  let s = Object.assign({}, KEYS[0]); let last = 0;
  for (let i = 1; i < KEYS.length; i++) { const k = KEYS[i]; if (t <= k.at) break; const u = Math.min(1, (t - k.at) / k.dur), e = EASE[k.ease || 'glide'](u);
    const p = Object.assign({}, s); for (const f of ['x', 'y', 'z', 'tilt', 'rot']) if (k[f] !== undefined) s[f] = p[f] + (k[f] - p[f]) * e; last = k.at + k.dur; if (u < 1) { last = null; break; } }
  if (last !== null && t < KEYS[KEYS.length - 1].at) { const h = Math.max(0, t - last); const d = D.drift; s.z *= 1 + Math.min(h, 6) * d; s.x += Math.min(h, 6) * 2.2; }  // holds keep drifting (no frozen frames)
  return s;
}
let CS = camAt(0);
function camApply(s) { CS = s; cam.style.transform = `translate(${VX}px,${VY}px) rotateX(${s.tilt.toFixed(3)}deg) rotate(${(s.rot || 0).toFixed(3)}deg) scale(${s.z.toFixed(5)}) translate(${(-s.x).toFixed(2)}px,${(-s.y).toFixed(2)}px)`;
  extr.setAttribute('transform', `translate(0,${(9 / s.z).toFixed(2)})`); }
function proj(wx, wy) { const s = CS, r = (s.rot || 0) * Math.PI / 180; let x = (wx - s.x) * s.z, y = (wy - s.y) * s.z; const xr = x * Math.cos(r) - y * Math.sin(r), yr = x * Math.sin(r) + y * Math.cos(r);
  const a = s.tilt * Math.PI / 180, y2 = yr * Math.cos(a), z2 = yr * Math.sin(a), f = PERS / (PERS - z2); return { x: VX + xr * f, y: VY + y2 * f, f }; }

/* ================= HUD helpers ================= */
const hud = $('hud'), fx = $('fx');
function pin(key, label, flag) { const p = mk('div', { class: 'pin' }, hud); p.innerHTML = `<div class="dot"></div><div class="tag">${flag ? `<span style="font-family:Emo">${flag}</span> ` : ''}${label}</div>`; p.key = key; return p; }
function emo(ch, size) { const e = mk('div', { class: 'emo' }, fx); e.textContent = ch; e.style.fontSize = size + 'px'; return e; }
function lab(txt) { const e = mk('div', { class: 'lab' }, hud); e.textContent = txt; return e; }
const ANCH = [];  // HUD elements that ride a world point: {el, key|xy, dx, dy}
const ride = (el, key, dx, dy) => ANCH.push({ el, key, dx: dx || 0, dy: dy || 0 });

/* ================= build ================= */
function build() {
  const tl = gsap.timeline({ paused: true }); const IR = { immediateRender: false }; const MO = BhugolMotion(tl);
  const evs = [];  // visual beats (for the sound plan)
  const ev = (t, kind) => evs.push({ t: +t.toFixed(3), kind });
  const PUN = (at, lv, back) => { MO.punch($('cshake'), at, lv, back); ev(at, 'punch'); };
  const pop = (el, at, s0, ease) => { tl.fromTo(el, { opacity: 0, scale: s0 || .4 }, { opacity: 1, scale: 1, duration: .45, ease: ease || 'back.out(1.6)', ...IR }, at); };
  const out = (el, at, d) => tl.to(el, { opacity: 0, duration: d || .25, ease: 'power2.in' }, at);
  const fadeA = (el, v, at, d) => tl.to(el, { attr: { opacity: v }, duration: d || .4, ...IR }, at);
  const place = (el, x, y) => tl.set(el, { x, y }, 0);

  // ---- camera driver (pure function of time) + HUD anchors ----
  MO.driver(0, D.dur, t => { camApply(camAt(t)); for (const a of ANCH) { const w = a.fn ? a.fn(t) : a.key ? PT[a.key] : a.xy; const q = proj(w[0], w[1]); a.el.style.left = (q.x + a.dx).toFixed(1) + 'px'; a.el.style.top = (q.y + a.dy).toFixed(1) + 'px'; } });

  // ===== cover at frame 0 (= loop seam) =====
  for (const k in FL) tl.set(FL[k], { opacity: .82 }, 0);
  const cov = mk('div', { class: 'ttl' }, $('titles')); cov.style.top = '170px';
  cov.innerHTML = D.cover.map((l, i) => `<div style="font-size:${i === 2 ? 150 : 124}px;-webkit-text-stroke-width:${i === 2 ? 22 : 19}px;margin-top:${i ? 6 : 0}px">${l}</div>`).join('');
  tl.set(cov, { opacity: 1 }, 0); tl.to(cov, { opacity: 0, y: -30, scale: .92, duration: .28, ease: 'power2.in' }, .12);
  tl.fromTo($('badge'), { opacity: 1 }, { opacity: 1, duration: .1, ...IR }, 0);

__SCENES__

  // ===== captions =====
  const CAPS = D.chunks.map(c => { const g = mk('div', { class: 'cap' }, $('caps')); const d = mk('div', { class: 'cl' }, g); markup(c.txt, d); return { c, g, d, words: [...g.querySelectorAll('span')] }; });
  for (const K of CAPS) { let fs = 96; K.g.style.opacity = 1; K.d.style.fontSize = '96px'; const w = K.d.scrollWidth; if (w > 860) fs = 96 * 860 / w; K.g.style.opacity = 0;
    Object.assign(K.d.style, { fontSize: fs.toFixed(1) + 'px', webkitTextStrokeWidth: (fs * .17).toFixed(1) + 'px', top: (1390 - fs * .5).toFixed(1) + 'px' }); }
  for (const K of CAPS) { const c = K.c; tl.set(K.g, { opacity: 1 }, c.sn); tl.set(K.g, { opacity: 0 }, c.en);
    tl.fromTo(K.g, { scale: .9, transformOrigin: '540px 1390px' }, { scale: 1, duration: .2, ease: 'power3.out', ...IR }, c.sn);
    MO.karaoke(K.words, c.wt, w => w.classList.contains('k'));
    K.words.forEach((w, i) => { if (w.classList.contains('k')) MO.sweep(w, c.wt[Math.min(i, c.wt.length - 1)]); }); }
  window.__EVS = evs;
  return tl;
}
window.__timelines = window.__timelines || {};
document.fonts.ready.then(() => { window.__timelines['main'] = build(); });
</script>
