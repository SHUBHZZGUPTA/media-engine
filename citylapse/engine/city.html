<script>
const D = __DATA__;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const lerp = (a, b, t) => a + (b - a) * t;

const W = __W__, H = __H__, SC = 0.1;   // 1 scene unit = 10 m
const P = D.plan, SCN = D.scene;
const KX = 111320 * Math.cos(SCN.origin[0] * Math.PI / 180), KZ = 110540;
const LL = (lat, lon) => [(lon - SCN.origin[1]) * KX * SC, (SCN.origin[0] - lat) * KZ * SC];

/* ---------- three ---------- */
const T3 = THREE;

uniform float uLine; uniform vec2 uRes; uniform vec3 uFogDay; uniform vec3 uFogNight; uniform vec2 uFog; varying float vDepth;

gMat.onBeforeCompile = s => { Object.assign(s.uniforms, U, { uLand: { value: landTex }, uTex: { value: new T3.Vector2(SCN.land_size[0], SCN.land_size[1]) }, uExt: { value: new T3.Vector4(X0, Z0, X1, Z1) }, uRoad: { value: roadTex }, uCoast: { value: COAST } });
  s.vertexShader = s.vertexShader.replace('#include <common>', '#include <common>\nvarying vec2 vLuv; varying vec2 vGw; varying float vDepth; uniform vec4 uExt;')

  if (g > 0.5 && g < 254.5 && uYear < 1900.0 + g * 0.5) l = 1.0;

    .replace('#include <map_fragment>', `
vec2 px = 1.0 / uTex; vec2 tc = vLuv * uTex - 0.5; vec2 fq = fract(tc); vec2 b0 = (floor(tc) + 0.5) / uTex;

L = smoothstep(0.3, 0.7, L);
float outE = max(max(-vLuv.x, vLuv.x - 1.0), max(-vLuv.y, vLuv.y - 1.0));

vec3 sand = mix(vec3(0.93, 0.80, 0.58), vec3(0.83, 0.66, 0.45), clamp(n * 0.8 + dune * 0.25 + el * 0.6, 0.0, 1.0));
sand = mix(sand, vec3(0.97, 0.90, 0.74), (1.0 - smoothstep(0.0, 0.5, near)) * 0.0 + smoothstep(0.55, 0.95, 1.0 - near) * 0.0);
vec3 sea = mix(vec3(0.06, 0.36, 0.56), vec3(0.22, 0.72, 0.74), smoothstep(0.0, 0.9, near));
float beach = L * (1.0 - smoothstep(0.62, 1.0, near));
sand = mix(sand, vec3(0.98, 0.92, 0.78), beach * 0.7);
vec3 col = mix(sea, sand, L);
float rc = floor(texture2D(uRoad, vLuv).r * 255.0 + 0.5); float rIn = texture2D(uRoad, vLuv).r;
float road = (rc > 0.5 ? smoothstep(-1.0, 1.0, uYear - (1900.0 + rc * 0.5)) : 0.0) * L;

vec3 nightC = diffuseColor.rgb * mix(vec3(0.07, 0.11, 0.19), vec3(0.15, 0.16, 0.22), vLandF);
float lamp = vRoad * step(0.5, uElec) * clamp(behind() / 0.18, 0.0, 1.0);

  s.vertexShader = s.vertexShader.replace('#include <common>', '#include <common>\nvarying float vDepth;').replace('#include <project_vertex>', '#include <project_vertex>\nvDepth = -mvPosition.z;');
  s.fragmentShader = s.fragmentShader.replace('#include <common>', '#include <common>\n' + SIDE).replace('#include <fog_fragment>', `{ float sd = sideAt(); gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(0.03,0.07,0.13), sd); gl_FragColor.rgb = applyFog(gl_FragColor.rgb, sd); }`); };
scene.add(farSea);

// ---------- buildings (instanced boxes that grow by year) ----------

const NREC = R.length / 8; const inst = [];
for (let i = 0; i < NREC; i++) { const o = i * 8, x = R[o], z = R[o + 1], w = R[o + 2], d = R[o + 3], rot = R[o + 4], h = R[o + 5], by = R[o + 6], gr = R[o + 7];
  if (h > 300) {   // supertall: tapered tiers + spire so it reads as a tower, not a slab
    const tiers = 7; for (let k = 0; k < tiers; k++) inst.push([x, z, w * (1 - k * .12), d * (1 - k * .12), rot, h * (.42 + k * .075), by, gr]);
    inst.push([x, z, w * .09, d * .09, rot, h, by, gr]);
  } else inst.push([x, z, w, d, rot, h, by, gr]); }
inst.sort((a, b) => a[6] - b[6]); const NI = inst.length; const BIRTHS = Float32Array.from(inst, r => r[6]);
const bornBy = y => { let lo = 0, hi = NI; while (lo < hi) { const m = (lo + hi) >> 1; if (BIRTHS[m] <= y) lo = m + 1; else hi = m; } return lo; };
const box = new T3.BoxGeometry(1, 1, 1); box.translate(0, .5, 0);
const aBirth = new Float32Array(NI), aGrow = new Float32Array(NI), aRank = new Float32Array(NI);

const bMat = new T3.MeshStandardMaterial({ color: 0xffffff, roughness: .82, metalness: 0 });
const VDECL = 'attribute float aBirth; attribute float aGrow; attribute float aRank; uniform float uYear; varying float vRank; varying float vOld; varying vec3 vW; varying float vNy; varying float vDepth;';
const VGROW = `#include <begin_vertex>
float g = clamp((uYear - aBirth) / max(aGrow, 0.01), 0.0, 1.0);
transformed.y *= g; if (g <= 0.0) transformed *= 0.0;
vRank = aRank; vOld = aBirth < 1958.0 ? 1.0 : 0.0; vNy = normal.y;
vW = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;`;
bMat.onBeforeCompile = s => { Object.assign(s.uniforms, U);
  s.vertexShader = s.vertexShader.replace('#include <common>', '#include <common>\n' + VDECL).replace('#include <begin_vertex>', VGROW)
    .replace('#include <project_vertex>', '#include <project_vertex>\nvDepth = -mvPosition.z;');
  s.fragmentShader = s.fragmentShader.replace('#include <common>', `#include <common>
uniform float uLit; uniform float uElec; uniform float uTime; uniform float uYear; varying float vRank; varying float vOld; varying vec3 vW; varying float vNy;` + SIDE)

float h = hsh(vec3(vRank * 977.0, fl, col));

em += on * mix(vec3(1.0, 0.72, 0.38), vec3(1.0, 0.92, 0.75), step(0.6, hsh(vec3(fl, col, vRank)))) * 1.9;

float fk = 0.85 + 0.15 * sin(uTime * 9.0 + vRank * 40.0);
em += lant * vec3(1.0, 0.55, 0.18) * 2.2 * fk;
vec3 nightC = diffuseColor.rgb * (vNy > 0.5 ? vec3(0.17, 0.19, 0.27) : vec3(0.09, 0.10, 0.16)) + em;

};
const dMat = new T3.MeshDepthMaterial({ depthPacking: T3.RGBADepthPacking });
dMat.onBeforeCompile = s => { Object.assign(s.uniforms, U);
  s.vertexShader = s.vertexShader.replace('#include <common>', '#include <common>\n' + VDECL).replace('#include <begin_vertex>', VGROW); };
const bld = new T3.InstancedMesh(box, bMat, NI); bld.customDepthMaterial = dMat; bld.castShadow = true; bld.receiveShadow = true; bld.frustumCulled = false;
const m4 = new T3.Matrix4(), q = new T3.Quaternion(), yA = new T3.Vector3(0, 1, 0), cc = new T3.Color();
const PAL = { old: [0xD9B98A, 0xCFA977, 0xE2C79C], mid: [0xF4EFE4, 0xEAD9BE, 0xE2C6A0, 0xF0E4CF, 0xD7B48B], villa: [0xF2DDB8, 0xE9C99A, 0xF6E9D2, 0xD8A97A, 0xEFD3A8], tower: [0x8FB3CF, 0xA9C4D8, 0x7FA2C2, 0xC9D6E0, 0x6D93B8, 0xB5C9D9] };
for (let i = 0; i < NI; i++) { const [x, z, w, d, rot, h, by, gr] = inst[i];
  q.setFromAxisAngle(yA, -rot); m4.compose(new T3.Vector3(x * SC, 0, z * SC), q, new T3.Vector3(Math.max(w, 2) * SC, Math.max(h, 2.5) * SC, Math.max(d, 2) * SC)); bld.setMatrixAt(i, m4);
