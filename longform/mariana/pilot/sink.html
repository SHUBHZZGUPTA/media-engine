<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/>
<script src="./gsap.min.js"></script>
<style>@font-face{font-family:Pop;font-weight:700;src:url(assets/pop.ttf)} body{margin:0;background:#000}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#000} #cv{position:absolute;inset:0}</style></head>
<body><div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="10.8">
<div id="stage" class="clip" data-start="0" data-duration="10.8"><canvas id="cv" width="1920" height="1080"></canvas></div></div>
<script>
// The Trieste sinking: layered motion, fully deterministic (every frame is a function of t).
const D=10.8, W=1920, H=1080, cv=document.getElementById('cv'), g=cv.getContext('2d');
let rs=1; const rnd=()=>{rs=(rs*16807)%2147483647;return rs/2147483647};
const P=[...Array(260)].map(()=>({x:rnd()*W,y:rnd()*H,z:.25+rnd()*1.6,s:rnd()}));          // marine snow, z = depth layer
const B=[...Array(40)].map((_,i)=>({o:rnd()*3,x:(rnd()-.5)*60,r:2+rnd()*5,v:110+rnd()*120}));  // bubbles from the float
const sub=new Image(); sub.src='assets/sub.png'; let ready=new Promise(r=>sub.onload=r);
const ease=u=>u*u*(3-2*u), cl=(v,a,b)=>Math.min(b,Math.max(a,v));
function frame(t){
  const u=t/D, dark=ease(cl(u,0,1));                         // 0 = sunlit blue, 1 = near-black
  // water: gradient that darkens as we go down
  const top=[18-14*dark,92-80*dark,150-128*dark], bot=[4-3*dark,22-19*dark,52-45*dark];
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,`rgb(${top})`); gr.addColorStop(1,`rgb(${bot})`); g.fillStyle=gr; g.fillRect(0,0,W,H);
  // sun rays fade out with depth
  g.save(); g.globalCompositeOperation='lighter';
  for(let i=0;i<7;i++){ const a=(1-dark)*.07*(0.6+0.4*Math.sin(t*0.9+i*1.7)); const x=200+i*260+Math.sin(t*.3+i)*40;
    const rg=g.createLinearGradient(x,0,x+180,H*.9); rg.addColorStop(0,`rgba(140,200,255,${a})`); rg.addColorStop(1,'rgba(140,200,255,0)');
    g.fillStyle=rg; g.beginPath(); g.moveTo(x-30,0); g.lineTo(x+60,0); g.lineTo(x+380,H); g.lineTo(x+160,H); g.fill(); }
  g.restore();
  // far particles (behind the sub): drift UP fast = we are sinking
  const drawP=(front)=>{ for(const p of P){ if((p.z>1.1)!==front) continue;
    const y=((p.y - t*170*p.z) % H + H) % H, x=p.x+Math.sin(t*.7+p.s*9)*12*p.z, r=.8+p.z*1.6;
    g.fillStyle=`rgba(210,230,255,${.25+.35*p.s*(1-dark*.4)})`; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); } };
  drawP(false);
  // the sub: slow downward drift in frame + gentle bob/tilt (camera follows, so most of the sinking reads through particles + light)
  const sy=330+120*ease(cl(u,0,1))+Math.sin(t*1.3)*8, sx=W/2+Math.sin(t*.5)*14, ang=Math.sin(t*.8)*.012, sc=1.0;
  // lamp beam from the crew sphere
  const bx=sx+40, by=sy+175; g.save(); g.translate(bx,by); g.rotate(.55+Math.sin(t*1.1)*.06); g.globalCompositeOperation='lighter';
  const bg_=g.createLinearGradient(0,0,0,620); bg_.addColorStop(0,`rgba(255,235,180,${.32+.12*dark})`); bg_.addColorStop(1,'rgba(255,235,180,0)');
  g.fillStyle=bg_; g.beginPath(); g.moveTo(-10,0); g.lineTo(10,0); g.lineTo(190,620); g.lineTo(-190,620); g.fill(); g.restore();
  g.save(); g.translate(sx,sy); g.rotate(ang); g.filter=`brightness(${1-.45*dark})`; g.drawImage(sub,-sub.width/2*sc,-sub.height/2*sc,sub.width*sc,sub.height*sc); g.restore(); g.filter='none';
  // lamp glow
  g.save(); g.globalCompositeOperation='lighter'; const gl=g.createRadialGradient(bx,by,0,bx,by,60); gl.addColorStop(0,'rgba(255,240,200,.9)'); gl.addColorStop(1,'rgba(255,240,200,0)'); g.fillStyle=gl; g.fillRect(bx-60,by-60,120,120); g.restore();
  // bubbles rising from the float
  for(const b of B){ const life=((t+b.o)%3)/3; const y=sy-150-life*b.v*3, x=sx-60+b.x+Math.sin(life*12+b.o)*8;
    g.strokeStyle=`rgba(220,240,255,${.55*(1-life)})`; g.lineWidth=1.5; g.beginPath(); g.arc(x,y,b.r,0,7); g.stroke(); }
  drawP(true);
  // depth counter
  const m=Math.round(10900*ease(cl(u,0,1))/10)*10; g.font='700 64px Pop'; g.textAlign='right';
  g.lineWidth=10; g.strokeStyle='rgba(2,10,20,.9)'; g.strokeText('↓ '+m.toLocaleString('en-US')+' m',W-70,120); g.fillStyle='#fff'; g.fillText('↓ '+m.toLocaleString('en-US')+' m',W-70,120);
  // vignette
  const vg=g.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,`rgba(0,0,0,${.45+.3*dark})`); g.fillStyle=vg; g.fillRect(0,0,W,H);
}
window.__timelines=window.__timelines||{};
Promise.all([ready,document.fonts.load('700 64px Pop')]).then(()=>{ const tl=gsap.timeline({paused:true}); const c={t:0};
  tl.fromTo(c,{t:0},{t:D,duration:D,ease:'none',immediateRender:false,onUpdate:()=>frame(c.t)},0); frame(0); window.__timelines['main']=tl; });
</script></body></html>
